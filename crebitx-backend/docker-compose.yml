version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: crebitx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-crebitx}
      POSTGRES_USER: ${DB_USER:-crebitx_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crebitx_password}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-crebitx_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crebitx-network

  # NestJS Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: crebitx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-crebitx}
      DB_USER: ${DB_USER:-crebitx_user}
      DB_PASSWORD: ${DB_PASSWORD:-crebitx_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-15m}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-7d}
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    networks:
      - crebitx-network

volumes:
  postgres_data:
    driver: local

networks:
  crebitx-network:
    driver: bridge
